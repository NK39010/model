# Defines the minimal Python project metadata for the backend example.
[project]
name = "bio-tool-backend-example"
version = "0.1.0"
description = "A minimal modular backend example for bioinformatics tools."
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.83",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "scikit-image>=0.22",
]

[project.scripts]
api = "app.main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
